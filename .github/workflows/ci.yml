name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv python install 3.15
      - run: uv run --with pytest pytest -q

  powershell-help:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Check Get-Help and native CLI forwarding
        shell: pwsh
        run: |
          uv python install 3.15
          uv sync --python 3.15
          $env:PATH = (Join-Path (Get-Location) '.venv\Scripts') + [IO.Path]::PathSeparator + $env:PATH
          . './src/codigest/shell/help.ps1'
          $synopsis = (Get-Help codigest).Synopsis
          if ($synopsis -notmatch 'Share selected code') { throw "Get-Help codigest failed: $synopsis" }
          $output = codigest --version | Out-String
          if ($LASTEXITCODE -ne 0 -or $output -notmatch 'codigest') { throw "CLI forwarding failed: $output" }
          # CI has no interactive console: PowerShell's help pager throws
          # 'The handle is invalid', even though Get-Help resolves this function.
          $examples = Get-Help codigest -Examples | Out-String
          if ($examples -notmatch 'codigest term --context') { throw "Examples not found: $examples" }
      - name: Check Windows PowerShell 5.1 compatibility
        shell: powershell
        run: |
          $env:PATH = (Join-Path (Get-Location) '.venv\Scripts') + [IO.Path]::PathSeparator + $env:PATH
          . './src/codigest/shell/help.ps1'
          $summary = (Get-Help codigest).Synopsis
          if ($summary -notmatch 'Share selected code') { throw "Windows PowerShell help failed: $summary" }
