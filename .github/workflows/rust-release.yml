name: Rust release

# Builds cdg for each platform, attaches the archives to a GitHub release, then installs
# that release with install.ps1 / install.sh on each OS to check the installers end to end.
on:
  push:
    tags: ["rust-v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, os: windows-latest, archive: zip }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, archive: tar.gz }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, archive: tar.gz }
          # Intel macOS runners are retired; Apple Silicon cross-builds the Intel binary.
          - { target: x86_64-apple-darwin, os: macos-latest, archive: tar.gz }
          - { target: aarch64-apple-darwin, os: macos-latest, archive: tar.gz }
          # Termux runs Android binaries, which are not the same as Linux ARM64 ones.
          - { target: aarch64-linux-android, os: ubuntu-latest, archive: tar.gz }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - if: matrix.target == 'aarch64-linux-android'
        run: |
          ndk="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC_aarch64_linux_android=$ndk/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$ndk/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$ndk/llvm-ar" >> "$GITHUB_ENV"
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          name="codigest-${GITHUB_REF_NAME#rust-v}-${{ matrix.target }}"
          mkdir "$name"
          cp ../LICENSE "$name/"
          if [ "${{ matrix.archive }}" = zip ]; then
            cp "target/${{ matrix.target }}/release/cdg.exe" "$name/"
            7z a "$name.zip" "$name" > /dev/null
          else
            cp "target/${{ matrix.target }}/release/cdg" "$name/"
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: rust/codigest-*.${{ matrix.archive }}
          prerelease: false

  install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Windows'
        shell: pwsh
        env:
          CDG_VERSION: ${{ github.ref_name }}
        run: |
          ./install.ps1
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'User') + ';' + $env:Path
          cdg --version
          cdg tree -L 1
      - if: runner.os != 'Windows'
        env:
          CDG_VERSION: ${{ github.ref_name }}
        run: |
          sh install.sh
          export PATH="$HOME/.local/bin:$PATH"
          cdg --version
          cdg tree -L 1