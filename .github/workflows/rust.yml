name: Rust

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["rust/**", "src/**", "pyproject.toml", "uv.lock", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["rust/**", "src/**", "pyproject.toml", "uv.lock", ".github/workflows/rust.yml"]
  workflow_dispatch:

# A newer push to a pull request replaces the run that is still going
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: rust

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.pick.outputs.os }}
    steps:
      - id: pick
        working-directory: .
        shell: bash
        # macOS runs only on release tags or manual dispatch; Linux and Windows run on every push
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            echo 'os=["ubuntu-latest","windows-latest","macos-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Rust output against the Python build of the same commit, byte for byte.
  parity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv python install 3.15 && uv sync --python 3.15
        working-directory: .
        shell: bash
      - name: Compare with the Python build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            bin="$(cygpath -u "$GITHUB_WORKSPACE")/.venv/Scripts"
            export CODIGEST_PY="$GITHUB_WORKSPACE/.venv/Scripts/python.exe"
          else
            bin="$GITHUB_WORKSPACE/.venv/bin"
            export CODIGEST_PY="$bin/python"
          fi
          export PATH="$bin:$PATH" CODIGEST_PARITY=1
          cargo test --no-fail-fast -- --include-ignored
