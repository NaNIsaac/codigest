name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  pypi:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write  # PyPI Trusted Publishing
      contents: read
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v10.3.0
    - run: uv python install 3.15
    - run: uv build
    - uses: pypa/gh-action-pypi-publish@release/v1

  mcp:
    name: Publish to the MCP registry
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # GitHub OIDC login for io.github.NaNIsaac/*
      contents: read
    steps:
    - uses: actions/checkout@v7

    - name: Set server.json version from the tag
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp
        mv server.tmp server.json
        # The registry verifies the package on PyPI; wait until the release is visible.
        for i in $(seq 30); do
          curl -sf "https://pypi.org/pypi/codigest/$VERSION/json" > /dev/null && exit 0
          sleep 10
        done
        echo "codigest $VERSION not visible on PyPI" && exit 1

    - name: Install mcp-publisher
      run: curl -sL https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz | tar xz mcp-publisher

    - name: Publish
      run: |
        ./mcp-publisher login github-oidc
        # The registry checks PyPI itself and can still miss a release the JSON API already shows.
        for i in $(seq 6); do
          ./mcp-publisher publish && exit 0
          sleep 30
        done
        exit 1
