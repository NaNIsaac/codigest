name: Publish

on:
  push:
    tags:
      - 'v*'
  # Runs the gates alone, without an upload, to check them off a tag.
  workflow_dispatch:

jobs:
  gates:
    uses: NaNIsaac/.github/.github/workflows/publish-gates.yml@e2bfb9b4aa7820e8efe43afddf2d2308c6069ae3
    permissions:
      contents: read
    with:
      import-name: codigest
      python-version: "3.15"
      # the terminal tests drive bash, zsh and pwsh on a pseudo-terminal; the runner has no zsh
      test-command: sudo apt-get install -y -qq zsh && uv run --with pytest pytest -q
      smoke: codigest --help
      # PEM private-key patterns and mask templates in the redaction code, not keys
      leak-allow: "codigest/core/redact.py: private-key: 2"

  pypi:
    needs: gates
    if: startsWith(github.ref, 'refs/tags/v')
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write  # PyPI Trusted Publishing
      contents: read
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v10.3.3
    # The files the gates checked, not a new build
    - uses: actions/download-artifact@v8
      with:
        name: publish-gates-dist
        path: dist
    - uses: pypa/gh-action-pypi-publish@release/v1

  mcp:
    name: Publish to the MCP registry
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # GitHub OIDC login for io.github.NaNIsaac/*
      contents: read
    steps:
    - uses: actions/checkout@v7

    - name: Set server.json version from the tag
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp
        mv server.tmp server.json
        # The registry verifies the package on PyPI; wait until the release is visible.
        for i in $(seq 30); do
          curl -sf "https://pypi.org/pypi/codigest/$VERSION/json" > /dev/null && exit 0
          sleep 10
        done
        echo "codigest $VERSION not visible on PyPI" && exit 1

    - name: Install mcp-publisher
      run: curl -sL https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz | tar xz mcp-publisher

    - name: Publish
      run: |
        ./mcp-publisher login github-oidc
        # The registry checks PyPI itself and can still miss a release the JSON API already shows.
        for i in $(seq 6); do
          ./mcp-publisher publish && exit 0
          sleep 30
        done
        exit 1
