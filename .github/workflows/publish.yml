name: Publish Python distributions to PyPI and GitHub Pages

on:
  push:
    tags:
      - 'v*'  # v0.3.0 태그 푸시 시 배포 실행

jobs:
  build-n-publish:
    name: Build and publish Python distributions to PyPI
    runs-on: ubuntu-latest
    # v* 태그일 때만 실행
    if: startsWith(github.ref, 'refs/tags/v')
    environment: release
    permissions:
      id-token: write  # Trusted Publishing을 위한 필수 권한
      contents: read
    
    steps:
    - uses: actions/checkout@v4
    
    # uv 설치 (가장 빠르고 확실한 방법)
    - name: Install uv
      uses: astral-sh/setup-uv@v5
    
    # Python 3.14 설정 (uv 이용)
    - name: Set up Python
      run: uv python install 3.15
    
    # 의존성 설치 및 빌드 (uv build 하나로 해결)
    - name: Build package
      run: uv build
    
    # PyPI 배포 (기존 형식 유지)
    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  publish-mcp:
    name: Publish to the MCP registry
    needs: build-n-publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # GitHub OIDC login for io.github.NaNIsaac/*
      contents: read
    steps:
    - uses: actions/checkout@v4

    - name: Set server.json version from the tag
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp
        mv server.tmp server.json
        # The registry verifies the package on PyPI; wait until the release is visible.
        for i in $(seq 30); do
          curl -sf "https://pypi.org/pypi/codigest/$VERSION/json" > /dev/null && exit 0
          sleep 10
        done
        echo "codigest $VERSION not visible on PyPI" && exit 1

    - name: Install mcp-publisher
      run: curl -sL https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz | tar xz mcp-publisher

    - name: Publish
      run: |
        ./mcp-publisher login github-oidc
        ./mcp-publisher publish

  deploy-docs:
    name: Build and deploy Sphinx docs to GitHub Pages
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.15

      - name: Install Python and Sphinx dependencies
        run: |
          uv pip install --system --upgrade pip
          if [ -f docs/requirements.txt ]; then uv pip install --system -r docs/requirements.txt; fi

      - name: Build HTML docs with Sphinx
        run: |
          if [ -d "docs" ]; then
            sphinx-build -b html docs/source docs/html
            touch docs/html/.nojekyll
          else
            echo "No docs folder found, skipping build."
            mkdir -p docs/html
            touch docs/html/.nojekyll
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/html