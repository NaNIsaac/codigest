name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # "last updated" comes from git history
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv python install 3.15
      - name: Check the command reference against the CLI
        run: uv run python site/scripts/check_reference.py
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/configure-pages@v6.0.0
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - name: Check links and anchors in the built site
        run: uv run python site/scripts/check_links.py
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
