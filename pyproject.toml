[project]
name = "codigest"
version = "0.10.0"
description = "Human-Centered Codebase Context Manager for LLMs"
authors = [{ name = "Isaac Yong", email = "isaacyong@naver.com" }]
readme = "README.md"
requires-python = ">=3.15.0b1"
license = { text = "MIT" }
dependencies = [
    "typer",
    "rich",
    "loguru",
    "pathspec",
    "pyperclip",
    "tomli-w",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.15",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Intended Audience :: Developers",
]

[project.urls]
Homepage = "https://github.com/NaNIsaac/codigest"
Repository = "https://github.com/NaNIsaac/codigest"
Issues = "https://github.com/NaNIsaac/codigest/issues"

[project.scripts]
codigest = "codigest.main:app"
cdg = "codigest.main:app"

[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

# violations present when ruff became mandatory in CI; remove entries as they are fixed
[tool.ruff.lint.extend-per-file-ignores]
"src/codigest/commands/cap.py" = ["I001"]
