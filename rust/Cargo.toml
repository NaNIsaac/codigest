[package]
name = "codigest"
version = "0.13.0"
edition = "2024"
rust-version = "1.88"
description = "Share the code context you choose with an AI: the project, a few files, what changed, or a failing command."
license = "MIT"
repository = "https://github.com/NaNIsaac/codigest"
publish = false

[[bin]]
name = "cdg"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "wrap_help"] }
ctrlc = "3"
gethostname = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
toml = "0.9"
tree-sitter = "0.25"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"

[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = { version = "3", default-features = false }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
